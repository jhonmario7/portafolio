<a class="skip-link" [href]="i18n.base() + '#contenido'">{{ i18n.lang() === 'en' ? 'Skip to content' : 'Saltar al contenido' }}</a>

<app-nav />

<!-- Decorative, own chunk, loaded once the page is idle so it never touches LCP. -->
@defer (on idle) {
  <app-glyph-field />
}

<!-- Left padding clears the desktop sidebar. -->
<div class="lg:pl-24">
  <main id="contenido" tabindex="-1">
    <app-hero />
    <app-experience />
    <app-projects />
    <app-education />
    <app-contact />
  </main>

  <footer class="border-t border-border px-4 py-8 sm:px-6">
    <p class="text-center text-sm leading-relaxed text-text-muted">
      © {{ year }} {{ name }}<br />
      {{ i18n.lang() === 'en' ? 'Built with' : 'Construido con' }} <span class="text-accent">Angular</span> {{ i18n.lang() === 'en' ? 'and' : 'y' }} Tailwind
    </p>
  </footer>
</div>

<app-back-to-top />
