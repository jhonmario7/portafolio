<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Página no encontrada · Jhon Mario Rodriguez</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a0a0a">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Plain HTML on purpose: Cloudflare serves it with a real 404 status, no Angular needed. -->
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-content: center; gap: 1rem;
      padding: 1.5rem; text-align: center; background: #0a0a0a; color: #f5f5f4;
      font: 1rem/1.6 ui-sans-serif, system-ui, sans-serif;
    }
    h1, p { margin: 0; }
    p { color: #a8a29e; }
    .code { font: 700 4rem/1 ui-monospace, Consolas, monospace; color: #ff6b6b; }
    a {
      justify-self: center; padding: .75rem 1.5rem; border-radius: 999px;
      background: #dc2626; color: #fff; text-decoration: none; font-weight: 600;
    }
    a:focus-visible { outline: 2px solid #ff6b6b; outline-offset: 3px; }
  </style>
</head>
<body>
  <p class="code">404</p>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté roto o que la página se haya movido.</p>
  <a href="/">Volver al inicio</a>
</body>
</html>
